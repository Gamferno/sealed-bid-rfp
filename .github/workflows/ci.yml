name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts (compact)
        run: |
          if command -v compact >/dev/null 2>&1; then
            npm run compile
          else
            echo "Compact compiler not in CI environment; using checked-in managed artifacts."
          fi

      - name: Run tests
        run: npm test

      - name: Build contracts and UI
        run: npm run build

